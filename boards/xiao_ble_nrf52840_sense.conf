CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="Seeed Studio"
CONFIG_USB_DEVICE_PRODUCT="SlimeNRF Tracker XIAO Sense"

CONFIG_BATTERY_USE_REG_LDO_MAPPING=y
CONFIG_LED_RGB_COLOR=y

# riftcv1-band: rift_imu's 36-byte frame packets, and the IMU near the design's 1 kHz
CONFIG_ESB_MAX_PAYLOAD_LENGTH=40
CONFIG_SENSOR_GYRO_ODR=833
CONFIG_SENSOR_ACCEL_ODR=833

# riftcv1-band: no low-power reads (33 ms apart) when still, no IMU wake-up state and no
# activity timeout (15 minutes still sent the band to sleep): the band powers off by its button
CONFIG_SENSOR_LP_TIMEOUT=2000000000
CONFIG_USE_IMU_TIMEOUT=n
CONFIG_USE_ACTIVE_TIMEOUT=n
